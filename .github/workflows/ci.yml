name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify importability and version
        run: |
          python -c "import hexapod_cpg; print('imported version', hexapod_cpg.__version__)"

      - name: Run pytest
        run: python -m pytest -ra --cov=hexapod_cpg --cov-report=term-missing

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check sim

  smoke-render:
    name: Smoke-test rendering scripts
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Configure non-interactive matplotlib backend
        run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Render coupling graph (fast)
        run: python sim/scripts/render_coupling_graph.py

      - name: Render omega sweep (fast)
        run: python sim/scripts/render_omega_sweep.py

      - name: Render workspace map (fast)
        run: python sim/scripts/render_workspace_map.py

      - name: Render oscillator timeseries (fast)
        run: python sim/scripts/render_oscillator_timeseries.py
